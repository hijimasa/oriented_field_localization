name: ROS 2 Humble CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: humble-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build and test in the pinned ROS 2 environment
        run: ./docker/run_ci.sh
